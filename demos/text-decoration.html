<style>
  .set { display: grid; gap: 0.45rem; font-size: 0.85rem; }
  .wavy { text-decoration: underline wavy var(--swatch-2) 1px; text-underline-offset: 3px; }
  .thick { text-decoration: underline solid var(--swatch) 3px; text-underline-offset: 4px; }
  .through { text-decoration: line-through 2px var(--swatch-2); }
  .over { text-decoration: overline dotted var(--swatch-3) 2px; }
</style>
<div class="set">
  <span class="wavy">wavy, offset 3px</span>
  <span class="thick">solid, 3px thick</span>
  <span class="through">line-through</span>
  <span class="over">dotted overline</span>
</div>
