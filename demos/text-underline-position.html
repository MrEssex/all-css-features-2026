<style>
  .row { display: grid; gap: 0.35rem; font-size: 1.05rem; }
  u { text-decoration: underline 2px var(--swatch-2); }
  span { font-size: 0.6rem; color: var(--ink-faint); font-family: var(--mono); }
  .v { writing-mode: vertical-rl; block-size: 5rem; }
</style>
<div class="row">
  <div><u style="text-underline-position: auto">Typography judging</u> <span>auto</span></div>
  <div><u style="text-underline-position: under">Typography judging</u> <span>under — below all descenders</span></div>
</div>
<p style="margin-block-start:.4rem;font-size:.72rem;color:var(--ink-faint)">
  <code>under</code> clears the descenders entirely, which matters for CJK where
  an underline must not touch the glyphs.</p>
