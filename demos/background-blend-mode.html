<style>
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
  .f { block-size: 3.6rem; border-radius: 6px;
    background-image: linear-gradient(45deg, var(--swatch), transparent), radial-gradient(circle, var(--swatch-3), var(--swatch-2)); }
  .a { background-blend-mode: normal; } .b { background-blend-mode: multiply; }
  .c { background-blend-mode: screen; } .d { background-blend-mode: difference; }
  figcaption { font-family: var(--mono); font-size: 0.58rem; color: var(--ink-faint); margin-block-start: 0.2rem; }
</style>
<div class="row">
  <figure><div class="f a"></div><figcaption>normal</figcaption></figure>
  <figure><div class="f b"></div><figcaption>multiply</figcaption></figure>
  <figure><div class="f c"></div><figcaption>screen</figcaption></figure>
  <figure><div class="f d"></div><figcaption>difference</figcaption></figure>
</div>
<p style="margin-block-start:.4rem;font-size:.72rem;color:var(--ink-faint)">
  Blends a background's own layers together, not with what is behind the element.</p>
