<style>

  .quote::before { content: "“"; inset-block-start: 0; inset-inline-start: 0; }
  .quote::after { content: "”"; inset-block-end: -0.4rem; inset-inline-end: 0; }
  .rule { display: flex; align-items: center; gap: 0.5rem; font-size: 0.7rem; color: var(--ink-faint); margin-block-start: 0.5rem; }
