<style>
  .carousel { display: flex; gap: 0.5rem; overflow-x: auto; scroll-snap-type: x mandatory; anchor-name: --sm-carousel; }
  .carousel > div { flex: 0 0 70%; scroll-snap-align: center; block-size: 4rem; border-radius: 8px; display: grid; place-items: center; background: color-mix(in oklab, var(--swatch) 20%, transparent); font-size: 0.78rem; }
  .carousel::scroll-marker-group { position-anchor: --sm-carousel; display: flex; gap: 0.35rem; justify-content: center; padding-block-start: 0.5rem; }
  .carousel > div::scroll-marker { content: ""; inline-size: 0.55rem; aspect-ratio: 1; border-radius: 50%; background: var(--line); }
  .carousel > div::scroll-marker:target-current { background: var(--swatch); }
</style>
<div class="carousel"><div>one</div><div>two</div><div>three</div><div>four</div></div>
<p style="margin-block-start:.5rem;font-size:.72rem;color:var(--ink-faint)">
  Carousel dots generated by CSS, with the active one tracked automatically —
  no JavaScript, and they are real focusable controls.</p>
