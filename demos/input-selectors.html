<style>
  form { display: grid; gap: 0.4rem; }
  input { inline-size: 100%; }
  input:required { border-inline-start: 3px solid var(--swatch-2); }
  input:valid:not(:placeholder-shown) { border-color: var(--swatch-3); }
  input:invalid:not(:placeholder-shown) { border-color: var(--swatch-2); }
  input:disabled { opacity: 0.45; }
  .l { font-size: 0.7rem; color: var(--ink-faint); }
</style>
<form onsubmit="return false">
  <span class="l">Required — type a valid email to turn it green</span>
  <input type="email" required placeholder="you@example.com">
  <span class="l">Disabled</span>
  <input type="text" value="Not editable" disabled>
</form>
