<style>
  .list { display: grid; gap: 0.4rem; }
  label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 0.78rem;
    transition: background-color 150ms ease, border-color 150ms ease;
  }
  label:has(input:checked) {
    background: color-mix(in oklab, var(--swatch-3) 18%, transparent);
    border-color: var(--swatch-3);
  }
  .list:has(input:checked) .hint { opacity: 1; }
  .hint { font-size: 0.72rem; color: var(--ink-faint); opacity: 0.35; transition: opacity 150ms ease; }
</style>
<div class="list">
  <label><input type="checkbox"> The parent restyles itself</label>
  <label><input type="checkbox"> …because it :has() a checked input</label>
  <p class="hint">And this line reacts to a checkbox two levels down.</p>
</div>
