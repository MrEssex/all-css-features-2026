<style>
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
  .f { block-size: 3rem; border-radius: 6px; border: 3px solid var(--swatch); }
  .b { border-style: dashed; } .c { border-style: double; border-width: 6px; }
  .d { border-style: solid; border-width: 1px 5px; border-color: var(--swatch) var(--swatch-2); }
  figcaption { font-family: var(--mono); font-size: 0.6rem; color: var(--ink-faint); margin-block-start: 0.2rem; }
</style>
<div class="row">
  <figure><div class="f"></div><figcaption>solid 3px</figcaption></figure>
  <figure><div class="f b"></div><figcaption>dashed</figcaption></figure>
  <figure><div class="f c"></div><figcaption>double</figcaption></figure>
  <figure><div class="f d"></div><figcaption>per-side</figcaption></figure>
</div>
