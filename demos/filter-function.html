<style>
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
  .f { block-size: 3rem; border-radius: 6px; background: conic-gradient(from 45deg, var(--swatch), var(--swatch-2), var(--swatch-3), var(--swatch)); }
  .a { filter: sepia(0.8); } .b { filter: invert(1); }
  .c { filter: grayscale(1) brightness(1.3); } .d { filter: opacity(0.4) saturate(3); }
  figcaption { font-family: var(--mono); font-size: 0.56rem; color: var(--ink-faint); margin-block-start: 0.2rem; }
</style>
<div class="row">
  <figure><div class="f a"></div><figcaption>sepia</figcaption></figure>
  <figure><div class="f b"></div><figcaption>invert</figcaption></figure>
  <figure><div class="f c"></div><figcaption>grayscale+bright</figcaption></figure>
  <figure><div class="f d"></div><figcaption>opacity+saturate</figcaption></figure>
</div>
<p style="margin-block-start:.4rem;font-size:.72rem;color:var(--ink-faint)">
  Filter functions compose left to right, each feeding the next.</p>
