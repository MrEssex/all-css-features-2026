<style>
  .row { display: grid; gap: 0.2rem; font-size: 1.05rem; }
  .a { font-feature-settings: "liga" 0; }
  .b { font-feature-settings: "smcp" 1; }
  .c { font-feature-settings: "tnum" 1, "zero" 1; font-variant-numeric: tabular-nums slashed-zero; }
  span { font-size: 0.62rem; color: var(--ink-faint); font-family: var(--mono); }
</style>
<div class="row">
  <div>Default: office film flag</div>
  <div class="a">Ligatures off: office film flag <span>"liga" 0</span></div>
  <div class="b">small caps <span>"smcp" 1</span></div>
  <div class="c">0123 tabular 0 <span>"tnum" "zero"</span></div>
</div>
<p style="margin-block-start:.4rem;font-size:.72rem;color:var(--ink-faint)">
  The low-level escape hatch. Prefer the <code>font-variant-*</code> properties
  where they exist — they inherit properly and are not all-or-nothing.</p>
