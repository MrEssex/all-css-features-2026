<p>With the <code>hanging</code> keyword the indent inverts: every line except the
first is indented, which is exactly the shape a reference list or a glossary entry
wants — and it no longer needs a negative indent cancelled by padding.</p>
<p class="note"><code>text-indent: 2em hanging</code></p>
