<style>
  .box { contain: paint; inline-size: 8rem; block-size: 3rem; border: 1px dashed var(--line); border-radius: 6px; margin-block-end: 0.5rem; }
  .plain { contain: none; }
  .blob { inline-size: 12rem; block-size: 2rem; margin: 0.5rem; background: var(--swatch); border-radius: 4px; }
  code { display: block; font-size: 0.66rem; color: var(--ink-faint); margin-block-end: 0.2rem; }
</style>
<code>contain: paint — descendants cannot paint outside the box</code>
<div class="box"><div class="blob"></div></div>
<code>contain: none — the child overflows visibly</code>
<div class="box plain"><div class="blob"></div></div>
