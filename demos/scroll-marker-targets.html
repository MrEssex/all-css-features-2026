<style>
  .carousel { display: flex; gap: 0.5rem; overflow-x: auto; scroll-snap-type: x mandatory; scroll-marker-group: after; }
  .carousel > div { flex: 0 0 70%; scroll-snap-align: center; block-size: 4rem; border-radius: 8px; display: grid; place-items: center; background: color-mix(in oklab, var(--swatch-3) 22%, transparent); font-size: 0.78rem; }
  .carousel > div::scroll-marker { content: attr(data-label); padding: 0.15rem 0.5rem; border-radius: 2rem; font-size: 0.68rem; background: var(--sunken); border: 1px solid var(--line); }
  .carousel > div::scroll-marker:target-current { background: var(--swatch-3); color: oklch(15% 0 0); border-color: var(--swatch-3); }
</style>
<div class="carousel">
  <div data-label="Intro">Intro</div><div data-label="Body">Body</div><div data-label="End">End</div>
</div>
<p style="margin-block-start:.5rem;font-size:.72rem;color:var(--ink-faint)">
  Markers can carry real labels from the items they point at, so the generated
  navigation is meaningful rather than a row of anonymous dots.</p>
