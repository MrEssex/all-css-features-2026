<style>
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .row i { block-size: 3.5rem; border-radius: 6px; }
  .a { background-image: linear-gradient(var(--swatch), var(--swatch-2)); }
  .b { background-image: radial-gradient(circle, var(--swatch-3), transparent 70%); }
  .c { background-image: linear-gradient(45deg, var(--swatch) 25%, transparent 25% 75%, var(--swatch) 75%); background-size: 14px 14px; }
</style>
<div class="row"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<p style="margin-block-start:.5rem;font-size:.72rem;color:var(--ink-faint)">
  Gradients are images, so they work anywhere a URL would.</p>
