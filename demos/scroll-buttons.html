<style>
  .carousel { display: flex; gap: 0.5rem; overflow-x: auto; scroll-snap-type: x mandatory; }
  .carousel > div { flex: 0 0 60%; scroll-snap-align: start; block-size: 4rem; border-radius: 8px; display: grid; place-items: center; background: color-mix(in oklab, var(--swatch) 20%, transparent); font-size: 0.78rem; }
  .carousel::scroll-button(inline-start) { content: "←"; }
  .carousel::scroll-button(inline-end) { content: "→"; }
  .carousel::scroll-button(*) { border: 1px solid var(--line); background: var(--raised); border-radius: 50%; inline-size: 1.8rem; aspect-ratio: 1; cursor: pointer; }
  .carousel::scroll-button(*):disabled { opacity: 0.35; cursor: default; }
</style>
<div class="carousel"><div>one</div><div>two</div><div>three</div><div>four</div></div>
<p style="margin-block-start:.5rem;font-size:.72rem;color:var(--ink-faint)">
  Previous and next buttons generated by CSS, disabled automatically at each end.</p>
