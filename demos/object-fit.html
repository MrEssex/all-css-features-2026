<style>
  .set { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
  figure { display: grid; gap: 0.3rem; }
  .frame {
    block-size: 4.5rem;
    border-radius: 6px;
    overflow: clip;
    background: repeating-conic-gradient(var(--sunken) 0 25%, transparent 0 50%) 0 0 / 12px 12px;
  }
  svg { inline-size: 100%; block-size: 100%; }
  .fill svg { object-fit: fill; }
  .contain svg { object-fit: contain; }
  .cover svg { object-fit: cover; }
  .none svg { object-fit: none; }
  figcaption { font-family: var(--mono); font-size: 0.66rem; color: var(--ink-faint); }
</style>
<div class="set">
  <figure><div class="frame fill"><svg viewBox="0 0 40 20" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="20" fill="oklch(62% .17 275)"/><circle cx="20" cy="10" r="7" fill="oklch(85% .13 90)"/></svg></div><figcaption>fill</figcaption></figure>
  <figure><div class="frame contain"><svg viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="20" fill="oklch(62% .17 275)"/><circle cx="20" cy="10" r="7" fill="oklch(85% .13 90)"/></svg></div><figcaption>contain</figcaption></figure>
  <figure><div class="frame cover"><svg viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="20" fill="oklch(62% .17 275)"/><circle cx="20" cy="10" r="7" fill="oklch(85% .13 90)"/></svg></div><figcaption>cover</figcaption></figure>
  <figure><div class="frame none"><svg viewBox="0 0 40 20" width="40" height="20" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="20" fill="oklch(62% .17 275)"/><circle cx="20" cy="10" r="7" fill="oklch(85% .13 90)"/></svg></div><figcaption>none</figcaption></figure>
</div>
