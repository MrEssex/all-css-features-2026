<style>
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; text-align: center; padding: 0.4rem; }
  .f { block-size: 2.8rem; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); }
  .a { box-shadow: 0 2px 4px oklch(0% 0 0 / .2); }
  .b { box-shadow: 0 10px 24px -8px oklch(0% 0 0 / .45); }
  .c { box-shadow: inset 0 2px 6px oklch(0% 0 0 / .3); }
  .d { box-shadow: 0 0 0 3px color-mix(in oklab, var(--swatch) 40%, transparent); }
  figcaption { font-family: var(--mono); font-size: 0.58rem; color: var(--ink-faint); margin-block-start: 0.3rem; }
</style>
<div class="row">
  <figure><div class="f a"></div><figcaption>subtle</figcaption></figure>
  <figure><div class="f b"></div><figcaption>lifted</figcaption></figure>
  <figure><div class="f c"></div><figcaption>inset</figcaption></figure>
  <figure><div class="f d"></div><figcaption>focus ring</figcaption></figure>
</div>
