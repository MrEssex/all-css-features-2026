<style>
  .rows { display: grid; gap: 3px; font-family: var(--mono); font-size: 0.68rem; }
  .rows div { display: grid; grid-template-columns: 9rem 1fr; align-items: center; gap: 0.5rem; }
  .bar { block-size: 1.1rem; border-radius: 3px; background: var(--swatch); }
  .a { inline-size: abs(-40%); }
  .b { inline-size: abs(65%); }
  .c { inline-size: calc(50% + sign(-3) * 20%); background: var(--swatch-2); }
</style>
<div class="rows">
  <div><span>abs(-40%)</span><span class="bar a"></span></div>
  <div><span>abs(65%)</span><span class="bar b"></span></div>
  <div><span>50% + sign(-3)·20%</span><span class="bar c"></span></div>
</div>
