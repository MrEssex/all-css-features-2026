<style>
  form { display: grid; gap: 0.4rem; }
  input { inline-size: 100%; }
  input:user-invalid { border-color: var(--swatch-2); background: color-mix(in oklab, var(--swatch-2) 10%, transparent); }
  input:user-valid { border-color: var(--swatch-3); }
  .note { margin-block-start: 0.5rem; font-size: 0.72rem; color: var(--ink-faint); }
  label { font-size: 0.7rem; color: var(--ink-faint); }
</style>
<form onsubmit="return false">
  <label>Type something invalid, then fix it</label>
  <input type="email" required placeholder="you@example.com">
</form>
<p class="note"><code>:user-invalid</code> only matches after the user has
actually interacted, so an untouched empty field is not shouted at.</p>
