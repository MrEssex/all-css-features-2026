<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .grid i { block-size: 2rem; border-radius: 4px; background: var(--sunken); display: grid; place-items: center; font-family: var(--mono); font-size: 0.66rem; }
  .grid i:nth-child(odd) { background: color-mix(in oklab, var(--swatch) 20%, transparent); }
  .grid i:nth-child(3n) { outline: 2px solid var(--swatch-3); outline-offset: -2px; }
  .grid i:nth-child(-n + 2) { font-weight: 700; color: var(--swatch-2); }
  code { display: block; margin-block-start: 0.5rem; font-size: 0.66rem; color: var(--ink-faint); }
</style>
<div class="grid">
  <i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i>
  <i>7</i><i>8</i><i>9</i><i>10</i><i>11</i><i>12</i>
</div>
<code>fill: odd &nbsp; outline: 3n &nbsp; bold: -n+2 (the first two)</code>
