<style>
  input { inline-size: 100%; font-size: 0.9rem; margin-block-end: 0.35rem; }
  .bar { caret-shape: bar; } .block { caret-shape: block; } .under { caret-shape: underscore; }
  label { display: block; font-size: 0.68rem; color: var(--ink-faint); }
</style>
<label>caret-shape: bar</label><input class="bar" value="Click in me">
<label>caret-shape: block</label><input class="block" value="Click in me">
<label>caret-shape: underscore</label><input class="under" value="Click in me">
<p style="margin-block-start:.4rem;font-size:.72rem;color:var(--ink-faint)">
  A terminal-style block caret without faking the whole text field.</p>
