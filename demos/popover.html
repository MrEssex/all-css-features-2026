<style>
  [popover] {
    max-inline-size: 16rem;
    padding: 0.7rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--raised);
    color: var(--ink);
    font-size: 0.78rem;
  }
  [popover]::backdrop { background: oklch(0% 0 0 / .3); }
  button { padding: 0.35rem 0.8rem; border-radius: 6px; font-size: 0.78rem; }
  .note { margin-block-start: 0.5rem; font-size: 0.72rem; color: var(--ink-faint); }
</style>
<button type="button" popovertarget="popover-demo">Open popover</button>
<div id="popover-demo" popover>
  Light dismiss, top-layer stacking, focus management and Esc to close — all from
  two HTML attributes and no JavaScript.
</div>
<p class="note">No script on this demo at all.</p>
