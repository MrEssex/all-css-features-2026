<style>
  .bar { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.5rem; border-radius: 6px 6px 0 0; background: color-mix(in oklab, var(--swatch) 18%, transparent); font-size: 0.72rem;

  .note { margin-block-start: 0.5rem; font-size: 0.72rem; color: var(--ink-faint); }
